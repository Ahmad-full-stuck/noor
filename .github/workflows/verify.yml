name: Verify Noor changes

on:
  push:
    branches:
      - feat/integrated-planning-hub
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source-rule tests
        run: npm test
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in js/source-rules.js js/planner.js js/app.js; do
            node --check "$file"
          done
